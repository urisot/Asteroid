<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #000;
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #game-wrap {
      position: relative;
      width: min(100vw, 800px);
      aspect-ratio: 800 / 600;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid #222;
    }

    /* Controles táctiles: solo en pantallas con puntero "grueso" (touch) */
    #touch-controls { display: none; }
    @media (pointer: coarse) {
      #touch-controls {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        position: absolute;
        left: 0; right: 0; bottom: 0;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .touch-group {
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }
      .tbtn {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.08);
        color: #fff;
        font-size: 22px;
        font-family: monospace;
        touch-action: none;
        user-select: none;
      }
      .tbtn:active { background: rgba(255,255,255,0.25); }
      .tbtn.fire   { border-color: rgba(0,255,255,0.6); color: #0ff; }
      .tbtn.bomb   { border-color: rgba(255,0,255,0.6); color: #f0f; }
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="touch-controls">
      <div class="touch-group">
        <button class="tbtn" data-key="ArrowLeft">◀</button>
        <button class="tbtn" data-key="ArrowUp">▲</button>
        <button class="tbtn" data-key="ArrowRight">▶</button>
      </div>
      <div class="touch-group">
        <button class="tbtn bomb" data-key="KeyB">💣</button>
        <button class="tbtn fire" data-key="Space">●</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
