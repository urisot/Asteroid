<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #000;
      height: 100%;
      overscroll-behavior: none;
      transition: background 0.2s;
    }
    body.light-mode {
      background: #eef0f2;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #game-wrap {
      position: relative;
      width: min(100vw, 800px);
      aspect-ratio: 800 / 600;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid #222;
      transition: border-color 0.2s;
    }
    body.light-mode canvas {
      border-color: #bbb;
    }

    /* Toggle Light/Dark */
    #theme-toggle-wrap {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
    }
    .theme-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-family: monospace;
      font-size: 11px;
      color: #fff;
    }
    body.light-mode .theme-switch {
      color: #111;
    }
    .theme-switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .theme-switch .track {
      position: relative;
      width: 38px;
      height: 20px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      transition: background 0.2s, border-color 0.2s;
    }
    body.light-mode .theme-switch .track {
      background: rgba(0,0,0,0.08);
      border-color: rgba(0,0,0,0.35);
    }
    .theme-switch .thumb {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    body.light-mode .theme-switch .thumb {
      background: #333;
    }
    .theme-switch input:checked ~ .track .thumb {
      transform: translateX(18px);
    }

    /* Controles táctiles: solo en pantallas con puntero "grueso" (touch) */
    #touch-controls { display: none; }
    @media (pointer: coarse) {
      #touch-controls {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        position: absolute;
        left: 0; right: 0; bottom: 0;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .touch-group {
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }
      .tbtn {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.08);
        color: #fff;
        font-size: 22px;
        font-family: monospace;
        touch-action: none;
        user-select: none;
      }
      .tbtn:active { background: rgba(255,255,255,0.25); }
      .tbtn.fire   { border-color: rgba(0,255,255,0.6); color: #0ff; }
      .tbtn.bomb   { border-color: rgba(255,0,255,0.6); color: #f0f; }
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="theme-toggle-wrap">
      <label class="theme-switch">
        <span>🌙</span>
        <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre modo oscuro y claro">
        <span class="track"><span class="thumb"></span></span>
        <span>☀️</span>
      </label>
    </div>
    <div id="touch-controls">
      <div class="touch-group">
        <button class="tbtn" data-key="ArrowLeft">◀</button>
        <button class="tbtn" data-key="ArrowUp">▲</button>
        <button class="tbtn" data-key="ArrowRight">▶</button>
      </div>
      <div class="touch-group">
        <button class="tbtn bomb" data-key="KeyB">💣</button>
        <button class="tbtn fire" data-key="Space">●</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
